version: '3'
services:
  flask-app:
    build:
      context: ./www                # use dev-local www directory
    volumes:
      - ../../../webapp:/app        # project/webapp -> /app
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    env_file:
      - ../../../.env               # fixed: use project root .env

  mysql:
    image: mysql:8.0
    restart: always
    ports:
      - "${DOCKER_COMPOSE_MYSQL_EXTERNAL_PORT:-3306}:${DOCKER_COMPOSE_MYSQL_INTERNAL_PORT:-3306}"
    environment:
      MYSQL_ROOT_PASSWORD: ${OORT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OORT_MYSQL_DATABASE}
      MYSQL_USER: ${OORT_MYSQL_USER}
      MYSQL_PASSWORD: ${OORT_MYSQL_APPLICATION_PASSWORD}
    volumes:
      - oort_app_mysql_data:/var/lib/mysql
    env_file:
      - ../../../.env               # fixed to match flask-app

volumes:
  oort_app_mysql_data:
